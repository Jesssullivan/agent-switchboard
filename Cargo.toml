[workspace]
members = [
    "crates/swb-proto",
    "crates/swb-store",
    "crates/swb-broker",
    "crates/swb-agentd",
    "crates/swb",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/xoxd-ai/agent-switchboard"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
ulid = "=1.2.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
